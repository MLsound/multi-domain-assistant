repos:
  - repo: https://github.com/astral-sh/ruff-pre-commit
    rev: v0.4.0
    hooks:
      - id: ruff
        args: ["--fix"]
      - id: ruff-format

  - repo: local
    hooks:
      - id: pytest-unit
        name: pytest (unit tests only — fast)
        entry: poetry run pytest tests/ -x -q
          --ignore=tests/test_integration.py
          --ignore=tests/test_api.py
        language: system
        pass_filenames: false
        always_run: true
