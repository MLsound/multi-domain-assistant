[tool.poetry]
name = "agentic-rag-iteration-1"
version = "0.2.0"
description = "Multi-Agent Agentic RAG — Knowledge Assistant"
authors = ["Gemini CLI"]
package-mode = false

[tool.poetry.dependencies]
python = ">=3.11,<3.13"

# --- Core (pinned lower-bounds from lock file) ---
langgraph = ">=0.2.0"
qdrant-client = ">=1.9.0"
torch = "2.2.2"
sentence-transformers = ">=3.0.0"
ragas = ">=0.2.15,<0.3.0"
langchain = ">=0.3.0"
langchain-google-genai = ">=2.0.0"
langchain-community = ">=0.3.0"
pandas = ">=2.0.0"
numpy = ">=1.26.0"
python-dotenv = "^1.2.2"
google-generativeai = "^0.8.6"
pydantic-settings = ">=2.0.0"

# --- New core deps added in this refactoring ---
fastapi = ">=0.111.0"
uvicorn = {version = ">=0.30.0", extras = ["standard"]}
httpx = ">=0.27.0"
tenacity = ">=8.3.0"
rouge-score = ">=0.1.2"
langchain-text-splitters = ">=0.3.0"

# --- Auth + security stack (own implementation, no auth-as-a-service) ---
sqlalchemy = ">=2.0.0"
"python-jose" = {version = ">=3.3.0", extras = ["cryptography"]}
bcrypt = ">=4.0.0"
"email-validator" = ">=2.0.0"
pyyaml = ">=6.0"
"python-multipart" = ">=0.0.9"

# --- Reporting / presentation deliverables ---
"python-pptx" = {version = ">=0.6.23", optional = true}
"weasyprint" = {version = ">=62.0", optional = true}
markdown = {version = ">=3.5", optional = true}

# --- Observability & traceability ---
mlflow = ">=2.15.0"

# --- Optional provider extras ---
langchain-anthropic = {version = ">=0.2.0", optional = true}
langchain-groq = {version = ">=0.2.0", optional = true}
langchain-openai = {version = ">=0.2.0", optional = true}
langchain-moonshot = {version = ">=0.1.0", optional = true}
langchain-ollama = {version = ">=0.2.0", optional = true}

[tool.poetry.extras]
anthropic    = ["langchain-anthropic"]
groq         = ["langchain-groq"]
openrouter   = ["langchain-openai"]
moonshot     = ["langchain-moonshot"]
ollama       = ["langchain-ollama"]
all-providers = [
    "langchain-anthropic",
    "langchain-groq",
    "langchain-openai",
    "langchain-moonshot",
    "langchain-ollama",
]
docs = ["python-pptx", "weasyprint", "markdown"]

[tool.poetry.group.dev.dependencies]
pytest = ">=8.0.0"
pytest-asyncio = ">=0.23.0"
ruff = ">=0.4.0"

[build-system]
requires = ["poetry-core>=1.0.0"]
build-backend = "poetry.core.masonry.api"

[tool.ruff]
line-length = 100
target-version = "py311"

[tool.ruff.lint]
select = ["E", "F", "W", "I"]
ignore = ["E501"]

[tool.pytest.ini_options]
asyncio_mode = "auto"
testpaths = ["tests"]
